<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101417">
  <meta name="description" content="MuteGuard is a local microphone mute utility for Windows meetings.">
  <link rel="icon" href="../assets/muteguard.png">
  <link rel="manifest" href="site.webmanifest">
  <title>MuteGuard</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; color: #f5f7f8; background: #101417; }
    main { width: min(42rem, calc(100% - 2rem)); padding: clamp(2rem, 7vw, 4rem); border: 1px solid #2b3439; border-radius: 1.5rem; background: #171d21; box-shadow: 0 2rem 5rem rgb(0 0 0 / 35%); }
    img { width: 4.5rem; height: 4.5rem; }
    h1 { margin: 1.5rem 0 .6rem; font-size: clamp(2.4rem, 8vw, 4rem); letter-spacing: -.06em; }
    p { margin: 0; max-width: 34rem; color: #b9c3c8; font-size: 1.08rem; line-height: 1.65; }
    strong { color: #7ee5c2; font-weight: 650; }
  </style>
</head>
<body>
  <main>
    <img src="../assets/muteguard.png" alt="" width="72" height="72">
    <h1>MuteGuard</h1>
    <p><strong>Local. Focused. Predictable.</strong> A personal Windows utility for controlling the meeting microphone through global hotkeys, the system tray and a compact status overlay. Usage and build details live in the repository README.</p>
  </main>
</body>
</html>
