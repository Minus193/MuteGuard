[package]
name = "muteguard"
version = "1.5.0"
edition = "2024"
description = "Lightweight Windows microphone mute utility"
license = "Apache-2.0"
readme = "README.md"
publish = false

[dependencies]
anyhow = "1.0"
dioxus = { version = "0.7", default-features = false, features = ["desktop", "asset", "document", "minimal"] }
resvg = "0.47"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.52", features = ["time"] }
windows = { version = "0.58", features = [
    "Data_Xml_Dom",
    "UI_Notifications",
    "implement",
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Devices_FunctionDiscovery",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_Networking_WinHttp",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
] }
windows-core = "0.58"

[profile.release]
strip = "symbols"
